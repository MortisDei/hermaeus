name: Feature Request
description: Suggest an idea for Aether
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the problem or limitation first, before the solution.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like Aether to do? Alternatives you considered are welcome too.
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: License acknowledgement
      options:
        - label: >-
            I understand Aether is licensed under PolyForm Noncommercial 1.0.0
            (see COMMERCIAL.md for commercial use) and that any code
            contribution follows CONTRIBUTING.md.
          required: true
