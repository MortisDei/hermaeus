name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore
        run: dotnet restore Aether.sln

      - name: Build (zero warnings enforced)
        run: dotnet build Aether.sln --no-restore -c Release

      - name: Test
        run: dotnet test src/Aether.Tests/Aether.Tests.csproj --no-restore -c Release -v normal --nologo
