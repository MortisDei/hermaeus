name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || 'ci-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      # The repository has no lock files, so the cache key is the hash of
      # every project file: a package reference only changes when one of
      # those changes (r28 doc 06 6.3). Worth 20 to 30 seconds a run. It is
      # not, and must not be mistaken for, a fix for the Windows test gap.
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Hermaeus.sln

      - name: Build (zero warnings enforced)
        run: dotnet build Hermaeus.sln --no-restore -c Release

      # r29 doc 04 4.1: an experiment, not a settled optimisation. The
      # measurement in that doc showed the Windows leg's cost is hosted-runner
      # filesystem I/O rather than test code (the same test that takes 164ms on
      # a dev machine takes 4,409ms here). Real-time scanning of every file the
      # suite creates is the one cheap, reversible lever. Success condition:
      # the Windows summed test duration in the TRX artifact falls materially
      # below 501.4s. If it does not, delete this step.
      - name: Exclude test working set from Defender (windows only)
        if: runner.os == 'Windows' && github.event_name == 'push'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath $env:RUNNER_TEMP
          Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE

      # The TRX logger is VSTest's own, so this adds no package. It exists
      # because the Windows leg spends about seven times as long inside this
      # step as the Linux leg does, and nobody knew which tests owned the
      # difference (r28 doc 04 4.1). See docs/pull-requests.md, "CI timing".
      - name: Test
        run: dotnet test src/Hermaeus.Tests/Hermaeus.Tests.csproj --no-restore -c Release -v normal --nologo --logger "trx;LogFileName=test-results.trx"

      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-${{ matrix.os }}
          path: '**/test-results.trx'
          if-no-files-found: warn
