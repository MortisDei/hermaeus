name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      prerelease: ${{ steps.compute.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify tag matches Directory.Build.props
        id: compute
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version_prefix="$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props | head -n 1)"
          version_suffix="$(sed -n 's:.*<VersionSuffix>\(.*\)</VersionSuffix>.*:\1:p' Directory.Build.props | head -n 1)"
          if [[ -z "$version_prefix" ]]; then
            echo "Could not read VersionPrefix from Directory.Build.props." >&2
            exit 1
          fi
          version="$version_prefix"
          prerelease="false"
          if [[ -n "$version_suffix" ]]; then
            version="$version-$version_suffix"
            prerelease="true"
          fi
          expected_tag="v$version"
          if [[ "$TAG_NAME" != "$expected_tag" ]]; then
            echo "Tag '$TAG_NAME' does not match the version in Directory.Build.props ('$version'); expected tag '$expected_tag'." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Package (build.ps1)
        shell: pwsh
        run: ./build.ps1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-package
          path: |
            dist/*.zip
            dist/*.zip.sha256

  build-linux:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Package (build.sh)
        run: ./build.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-package
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

  release:
    needs: [verify, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-package
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: linux-package
          path: dist

      - name: Generate release notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          {
            ./scripts/release-notes.sh "$VERSION"
            ./scripts/release-notes-footer.sh "$VERSION"
          } > notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          prerelease_flag=()
          if [[ "$PRERELEASE" == "true" ]]; then
            prerelease_flag=(--prerelease)
          fi
          gh release create "$TAG_NAME" \
            --title "Hermaeus $TAG_NAME" \
            --notes-file notes.md \
            "${prerelease_flag[@]}" \
            dist/*.zip dist/*.zip.sha256 dist/*.tar.gz dist/*.tar.gz.sha256
